<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#180e29" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 21px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .scan-line {
        animation: scanAnim 4s ease-in-out infinite alternate;
      }
      .pulse-bbox {
        animation: pulseAnim 3s ease-in-out infinite alternate;
      }
      .orb-float {
        animation: orbAnim 6s ease-in-out infinite alternate;
      }

      @keyframes scanAnim {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(180px); opacity: 0.2; }
      }
      @keyframes pulseAnim {
        0% { stroke-opacity: 0.4; stroke-width: 1.5; }
        100% { stroke-opacity: 1; stroke-width: 2.5; }
      }
      @keyframes orbAnim {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(25px, -15px) scale(1.15); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Dynamic Glowing Ambient Orbs (Background layer) -->
  <circle class="orb-float" cx="150" cy="100" r="130" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle class="orb-float" cx="1050" cy="280" r="160" fill="#a855f7" opacity="0.14" filter="url(#glow)" />
  <circle class="orb-float" cx="600" cy="350" r="120" fill="#6366f1" opacity="0.1" filter="url(#glow)" />

  <!-- Dynamic Detection Visuals (Right side interactive graphic) -->
  <g transform="translate(900, 70)">
    <!-- Camera Target / Reticle Frame -->
    <rect x="0" y="0" width="240" height="220" rx="12" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6" />

    <!-- Scanning Laser Line -->
    <line class="scan-line" x1="5" y1="10" x2="235" y2="10" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />

    <!-- Detected Object Bounding Box 1 -->
    <rect class="pulse-bbox" x="25" y="45" width="110" height="135" rx="6" fill="url(#boxGrad1)" stroke="#38bdf8" stroke-width="2" />
    <!-- Label Tag 1 -->
    <rect x="25" y="25" width="80" height="20" rx="4" fill="#0284c7" />
    <text x="32" y="39" class="badge-text" font-size="11">person 0.98</text>

    <!-- Detected Object Bounding Box 2 -->
    <rect class="pulse-bbox" x="145" y="75" width="75" height="95" rx="6" fill="url(#boxGrad2)" stroke="#ec4899" stroke-width="2" />
    <!-- Label Tag 2 -->
    <rect x="145" y="55" width="65" height="20" rx="4" fill="#be185d" />
    <text x="152" y="69" class="badge-text" font-size="11">car 0.94</text>

    <!-- Target Reticle Crosshairs -->
    <circle cx="80" cy="112" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" />
    <circle cx="80" cy="112" r="4" fill="#38bdf8" />
  </g>

  <!-- Foreground Content: Header, Subtitle & Interactive Pills -->
  <!-- Top Category Pill -->
  <g transform="translate(70, 50)">
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="22" class="badge-text" fill="#cbd5e1">CURATED ECOSYSTEM &#8226; 2026</text>
  </g>

  <!-- Main Title -->
  <text x="70" y="135" class="title-text">
    Computer Vision <tspan fill="url(#accentGrad)">Utilities</tspan>
  </text>
  <text x="70" y="185" class="title-text">
    &amp; Object Detection
  </text>

  <!-- Subtitle -->
  <text x="70" y="230" class="subtitle-text">
    Top SaaS Platforms, Detection Transformers, SOTA YOLOs &amp; Edge Runtimes
  </text>

  <!-- Feature Tags / Metric Pills (Foreground) -->
  <g transform="translate(70, 275)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" fill-opacity="0.85" />
    <text x="16" y="23" class="badge-text" fill="#38bdf8">⚡ Real-Time YOLOs</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="145" height="36" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" fill-opacity="0.85" />
    <text x="161" y="23" class="badge-text" fill="#a5b4fc">🎯 DETRs &amp; Prompts</text>

    <!-- Pill 3 -->
    <rect x="305" y="0" width="155" height="36" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" fill-opacity="0.85" />
    <text x="321" y="23" class="badge-text" fill="#d8b4fe">📦 Annotation &amp; CV</text>

    <!-- Pill 4 -->
    <rect x="475" y="0" width="135" height="36" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" fill-opacity="0.85" />
    <text x="491" y="23" class="badge-text" fill="#fda4af">🚀 Edge Inference</text>

    <!-- Pill 5 -->
    <rect x="625" y="0" width="140" height="36" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.2" fill-opacity="0.85" />
    <text x="641" y="23" class="badge-text" fill="#86efac">🌐 Enterprise SaaS</text>
  </g>
</svg>
